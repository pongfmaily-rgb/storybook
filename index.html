<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315d40"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="theme.css"><title>故事書圖書館</title></head><body>
<header class="header"><strong>故事圖書館</strong><nav id="nav" hidden><button data-view="library">圖書館</button><button data-view="finished">讀完</button><button data-view="notebook">筆記本</button></nav><div><button id="settings-button" hidden>設定</button> <button id="profile-button" hidden>轉人</button></div></header>
<main><section id="profiles" class="profiles"><h1>我係邊個？</h1><p>揀你嘅圖書證，打開自己嘅故事世界。</p><div id="profile-cards"></div><button id="edit-profiles" hidden>⚙ 改名／新增讀者</button><form id="profile-form" hidden><h2>請家長輸入小朋友的名字</h2><p>最少填一個，最多兩個；名字只保存在這部裝置。</p><label>第一位 <input id="name-one" maxlength="40" autocomplete="off"></label><label>第二位（可留空） <input id="name-two" maxlength="40" autocomplete="off"></label><p id="profile-error" role="alert"></p><button class="solid" type="submit">儲存</button><button id="cancel-profiles" type="button" hidden>取消</button></form></section>
<section id="library" class="library" hidden><div class="intro"><div><h1>我的圖書館</h1><p>揀一本書，慢慢讀。</p></div><label class="button solid">＋ 加入書本<input id="import" type="file" accept=".zip,application/zip" multiple hidden></label></div><p id="status" role="status"></p><h2>正在閱讀</h2><div id="hero" class="hero"></div><div class="library-layout"><div><h2>書架</h2><div id="shelf" class="wood"></div></div><aside id="borrow" class="borrow"></aside></div></section>
<section id="finished" class="library" hidden><h1>讀完書櫃</h1><p>讀過嘅故事，都喺呢度。</p><div id="finished-shelf" class="wood"></div><aside id="finished-card" class="borrow"></aside></section>
<section id="notebook" class="notebook" hidden><div class="notehead"><h1>好詞好句筆記本</h1><label>按書篩選 <select id="filter"><option value="all">所有書本</option></select></label></div><div class="columns"><section><h2>好詞</h2><div id="word-notes"></div></section><section><h2>好句</h2><div id="sentence-notes"></div></section></div></section>
<section id="reader" class="reader" hidden><aside class="ribbon"><span>聆聽</span><button id="prev">上一段</button><button id="play">播放</button><button id="next">下一段</button></aside><article class="paper"><div class="paper-head"><h1 id="title"></h1><div class="settings"><button id="chapter">目錄</button><button id="smaller">A−</button><button id="larger">A＋</button><label><input id="stop-en" type="checkbox">英文每段停</label></div></div><div id="page-layout"><div id="page-art"></div><div><div id="content"></div><button id="add-selection" hidden>＋ 加入筆記</button><div id="after" hidden><button id="explain">聽講解</button><button id="continue">下一段</button></div></div></div><nav class="pages" aria-label="翻頁"><button id="prev-page">上一頁</button><span id="page-number"></span><button id="next-page">下一頁</button></nav></article></section></main>
<dialog id="card"><div id="card-content"></div><button id="speak-word">讀出詞語</button><button id="add-word">＋ 加入筆記</button><button id="close-card">關閉</button></dialog><dialog id="editor"><h2>加入筆記</h2><p id="selected-text"></p><label>類別 <select id="note-kind"><option value="word">好詞</option><option value="sentence">好句</option></select></label><label>感想<textarea id="thought"></textarea></label><button id="save-note">儲存筆記</button><button id="cancel-note">取消</button></dialog><dialog id="settings-dialog"><h2>設定</h2><label>名字 <input id="profile-name" maxlength="40"></label><label>配色 <select id="theme"><option value="kraft">牛皮紙</option><option value="night">夜燈</option><option value="cut">剪紙</option></select></label><button id="save-settings">儲存</button><button id="close-settings">關閉</button></dialog><dialog id="chapter-dialog"><h2>目錄</h2><div id="chapter-list"></div><button id="close-chapter">關閉</button></dialog><dialog id="image-dialog"><img id="full-image" alt="原書頁圖"><button id="close-image">關閉</button></dialog>
<script src="vendor/jszip.min.js"></script><script src="app.js"></script></body></html>
